# MergeGuard — Documentation site configuration
# Just the Docs via remote_theme (the pattern proven on PERCH-DOC / SteamDeck-DOC /
# AgentProof-DOC: NO `theme:` gem key — that combination produced "The just-the-docs
# theme could not be found" on GitHub Pages. remote_theme + the github-pages gem
# in the Gemfile is the working setup.)

title: MergeGuard
description: Documentation for MergeGuard — scene and prefab merge conflict resolution for Unity + Git, with a resolution journal, lock warnings and a pre-push risk check.
baseurl: "/MergeGuard-DOC"
url: "https://decnet-games.github.io"
repository: DecNet-Games/MergeGuard-DOC

remote_theme: just-the-docs/just-the-docs

color_scheme: dark

search_enabled: true
search:
  heading_level: 2

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "MergeGuard &copy; 2026 Decnet Games. Documentation for the Unity Asset Store package <code>com.decnetgames.mergeguard</code>."

aux_links:
  "Unity Asset Store":
    - "https://assetstore.unity.com/publishers/118262"
  "Decnet Games":
    - "https://decnetgames.com"
  "Discord":
    - "https://discord.gg/P9wepz7NBW"

aux_links_new_tab: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - PUSH-NOTE.md
  - README.md
  - vendor/
  - node_modules/
